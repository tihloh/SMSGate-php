name: Release PHP package

on:
  push:
    branches: [main]
    paths:
      - '.release-version'
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: smsgate-php-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, xmlwriter, gd
          coverage: none
      - name: Validate Composer package and tests
        run: |
          composer install --no-interaction --prefer-dist
          composer check
      - name: Create version tag and GitHub release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}

          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$VERSION" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test -f .release-version || { echo "Missing .release-version" >&2; exit 1; }
            VERSION="$(sed -n 's/^VERSION=//p' .release-version | head -n 1)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must have numeric major.minor.patch format" >&2
            exit 1
          fi
          TAG="v$VERSION"
          git fetch origin --tags
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG already exists" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "SMSGate PHP $TAG"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "SMSGate PHP $TAG" --generate-notes --latest
          echo "GitHub release $TAG created. Packagist indexing requires one-time Packagist registration." >> "$GITHUB_STEP_SUMMARY"
